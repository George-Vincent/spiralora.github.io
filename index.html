<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SPIRALORA ART STUDIO — Simple design. Endless creativity. Distinctive art.">
  <title>SPIRALORA | Art Studio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 5px;
    }

    header span {
      color: #999;
      font-size: 12px;
      letter-spacing: 2px;
    }

    main {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .hero {
      max-width: 760px;
    }

    .eyebrow {
      color: #aaa;
      letter-spacing: 5px;
      font-size: 12px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 88px);
      letter-spacing: 8px;
      margin-bottom: 25px;
    }

    .description {
      color: #bbb;
      font-size: 18px;
      line-height: 1.8;
      margin: 0 auto 35px;
      max-width: 590px;
    }

    .tagline {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .line {
      width: 55px;
      height: 1px;
      background: white;
      margin: 35px auto;
    }

    footer {
      border-top: 1px solid #222;
      padding: 25px 15px;
      text-align: center;
      color: #777;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">SPIRALORA</div>
    <span>ART STUDIO</span>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">WELCOME TO OUR WORLD</p>

      <h1>SPIRALORA</h1>

      <p class="description">
        Transforming ordinary photographs and creative ideas
        into distinctive works of art.
      </p>

      <div class="line"></div>

      <p class="tagline">
        Simple design. Endless creativity. Distinctive art.
      </p>
    </section>
  </main>

  <footer>
    © 2026 SPIRALORA ART STUDIO. ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
